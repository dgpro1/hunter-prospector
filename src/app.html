<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prospector · Hunter AI</title>
<meta name="theme-color" content="#050505">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prospector">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#050505;--bg2:#0b0907;--card:#110e0b;--card2:#17120e;--line:#251d17;--line2:#33281f;
  --fg:#f6efe8;--mut:#a59a90;--dim:#6f655d;
  --a:#ff6a00;--a2:#ff8a3d;--aglow:rgba(255,106,0,.18);
  --verde:#35c47c;--amarillo:#f2b33d;--naranja:#ff6a00;--rojo:#ff4d4d;--gris:#6f655d;--azul:#5aa9ff;--violeta:#a78bfa;
  --r:16px;--side:232px;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--a);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
/* Sidebar */
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:linear-gradient(180deg,#0d0a08,#060505);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.logo{width:34px;height:34px;border-radius:10px;background:radial-gradient(circle at 30% 30%,#ffb27a,var(--a) 55%,#a33f00);box-shadow:0 0 24px var(--aglow);display:grid;place-items:center;font-weight:800;color:#120800}
.brand b{font-size:15px;letter-spacing:.2px}.brand small{display:block;color:var(--mut);font-size:11px;margin-top:-2px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--mut);font-weight:500;position:relative}
.nav a:hover{background:#15100c;color:var(--fg)}
.nav a.on{background:linear-gradient(90deg,rgba(255,106,0,.16),rgba(255,106,0,.03));color:var(--fg)}
.nav a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--a)}
.nav svg{width:18px;height:18px;flex:none}
.badge{margin-left:auto;background:var(--a);color:#120800;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.side .foot{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:12px;color:var(--mut)}
.side .foot b{color:var(--fg)}
/* Main */
main{padding:28px clamp(16px,3vw,36px) 90px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.4px}.top h1 span{color:var(--a)}
.top p{color:var(--mut);margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--a);color:#120800;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--a);color:var(--a)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.grid{display:grid;gap:14px}.grid>*{min-width:0}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
/* Hoy strip */
.today{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:radial-gradient(120% 140% at 0% 0%,rgba(255,106,0,.16),transparent 55%),linear-gradient(180deg,var(--card),var(--bg2))}
.ring{width:96px;height:96px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:22px;line-height:1}
.ring .v small{display:block;font-size:11px;font-weight:500;color:var(--mut);margin-top:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--fg);background:#0d0a08;white-space:nowrap}
.chip.hot{border-color:rgba(255,106,0,.5);background:rgba(255,106,0,.08)}
.chip.warn{border-color:rgba(255,77,77,.5);background:rgba(255,77,77,.08)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
/* KPIs */
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:500}
.kpi .n{font-size:28px;font-weight:800;letter-spacing:-.6px;margin-top:4px}
.kpi .s{font-size:12px;color:var(--dim);margin-top:2px}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--glow,transparent);filter:blur(24px);opacity:.5}
.row2{grid-template-columns:1.1fr 1fr}.row3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1100px){.row3{grid-template-columns:1fr 1fr}}
@media(max-width:860px){.row2,.row3{grid-template-columns:1fr}}
/* Funnel */
.funnel{display:flex;flex-direction:column;gap:7px}
.fr{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:10px;font-size:13px;cursor:pointer}
.fr .bar{height:26px;border-radius:8px;background:#1a140f;overflow:hidden;position:relative}
.fr .bar i{position:absolute;inset:0 auto 0 0;border-radius:8px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.fr .bar span{position:absolute;left:10px;top:3px;font-weight:700;font-size:13px}
.fr .v{text-align:right;color:var(--mut);font-size:12px}
.chart{position:relative;height:220px}
/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}.li .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{color:var(--mut);font-size:12px}
.empty{color:var(--dim);font-size:13px;padding:12px 0}
/* Pipeline */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.in{background:#0d0a08;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;outline:none;min-width:0}
.in:focus{border-color:var(--a)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity}
.col{background:#0a0807;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 210px);scroll-snap-align:start}
.col.drop{border-color:var(--a);box-shadow:0 0 0 3px var(--aglow) inset}
.ch{min-height:58px;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.ch b{font-size:13px}.ch .c{color:var(--mut);font-size:12px;margin-left:auto}
.ch .sum{display:block;font-size:11.5px;color:var(--dim)}
.cards{padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:80px}
.lc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:grab;transition:border-color .15s,transform .1s}
.lc:hover{border-color:var(--line2);transform:translateY(-1px)}
.lc.dragging{opacity:.4}
.lc b{display:block;font-size:13.5px;line-height:1.3;margin-bottom:5px}
.lc .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--mut)}
.tag{border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600;background:#1c1610;color:var(--mut)}
.tag.anuncio{background:rgba(167,139,250,.14);color:var(--violeta)}.tag.cazador{background:rgba(90,169,255,.12);color:var(--azul)}.tag.manual{background:#1c1610}
.due{color:var(--rojo)!important;font-weight:600}
.more{color:var(--mut);font-size:12px;text-align:center;padding:6px}
/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:#0b0907;border-left:1px solid var(--line);z-index:31;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh h2{font-size:19px;line-height:1.25}.dh .x{margin-left:auto;background:none;border:1px solid var(--line2);border-radius:10px;width:34px;height:34px;cursor:pointer;flex:none}
.db{padding:16px 20px 40px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{border:1px solid var(--line2);background:#0d0a08;border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--mut)}
.step.done{color:var(--fg);border-color:rgba(255,106,0,.35)}
.step.on{background:var(--a);color:#120800;border-color:var(--a);font-weight:700}
.step.lost.on{background:var(--rojo);border-color:var(--rojo)}
.step.win.on{background:var(--verde);border-color:var(--verde)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.fields .full{grid-column:1/-1}.fields>*,.fields .in{min-width:0}.fields.f3{grid-template-columns:repeat(3,1fr)}
.info{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.info div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;min-width:0}
.info small{display:block;color:var(--mut);font-size:11px}
.info div span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl .e{position:relative;padding:0 0 12px 16px;font-size:13px}
.tl .e::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--line2);border:2px solid #0b0907}
.tl .e.nota::before{background:var(--a)}
.tl .e small{color:var(--dim);font-size:11px;display:block}
.chat{background:#080605;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto}
.bb{max-width:82%;padding:7px 11px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word;font-size:13px}
.bb small{display:block;color:var(--mut);font-size:10.5px;margin-top:2px}
.bb.in{align-self:flex-start;background:#1a1510;border:1px solid var(--line)}
.bb.out{align-self:flex-end;background:#3a1e08;border:1px solid #6b3410}
textarea.in{width:100%;resize:vertical}
/* Envíos */
.lead-row{display:grid;grid-template-columns:1fr;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.switch{width:46px;height:26px;border-radius:999px;background:#2a211a;position:relative;border:0;cursor:pointer;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on{background:var(--verde)}.switch.on::after{left:23px}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
/* Toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1d1610;border:1px solid var(--line2);color:var(--fg);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:50;max-width:min(560px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%)}
/* Mobile */
.tabs{display:none}
@media(max-width:860px){
  .app{grid-template-columns:1fr}.side{display:none}
  main{padding:18px 16px 96px}
  .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(8,6,5,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:10.5px;padding:4px;position:relative}
  .tabs a.on{color:var(--a)}.tabs svg{width:20px;height:20px}
  .tabs .badge{position:absolute;top:0;right:22%;margin:0;font-size:9.5px;padding:0 5px}
  .today{grid-template-columns:1fr}
  .board{grid-auto-columns:82%}
  .fields,.fields.f3{grid-template-columns:1fr}
  .top h1{font-size:22px}
}
.skel{color:var(--dim);padding:40px 0;text-align:center}
.top{padding-right:58px}
.drawer.on~.bell,.drawer.on~.alerts{display:none}
.stagebar{display:none}
@media(max-width:860px){
  .stagebar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px;position:sticky;top:0;z-index:5;background:linear-gradient(#050505 80%,transparent)}
  .stagebar button{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);color:var(--fg);border-radius:999px;padding:8px 12px;font:inherit;font-size:13px}
  .stagebar button.on{border-color:var(--a);background:rgba(255,106,0,.12)}
  .stagebar small{color:var(--mut);font-weight:600}
  .board{grid-auto-columns:calc(100% - 24px);scroll-snap-type:x mandatory}
  .col{max-height:calc(100dvh - 330px)}
  .lc{cursor:pointer;padding:12px 14px}.lc b{font-size:15px}
  .btn,.step{min-height:40px}
  .dh{padding-top:calc(14px + env(safe-area-inset-top))}
}
.bell{position:fixed;top:16px;right:18px;z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.bell svg{width:20px;height:20px}.bell .badge{position:absolute;top:-4px;right:-4px;margin:0}
.bell.ring svg{animation:ring .9s ease-in-out 2}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
.alerts{position:fixed;top:68px;right:18px;z-index:41;width:min(360px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:#0f0c0a;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.5);display:none}
.alerts.on{display:block}
.alerts h4{margin:0;padding:14px 16px;font-size:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.alerts .it{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;line-height:1.4}
.alerts .it:hover{background:var(--card)}.alerts .it.new{background:rgba(255,106,0,.07)}
.alerts .it small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.alerts .empty{padding:24px 16px;color:var(--mut);font-size:13px;text-align:center}
@media(max-width:860px){.bell{top:10px;right:12px;width:40px;height:40px}.alerts{top:58px;right:12px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">H</div><div><b>Prospector</b><small>Hunter AI · tu CRM</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="sidefoot">Cargando…</div>
  </aside>
  <main id="main"><div class="skel">Cargando tu CRM…</div></main>
</div>
<nav class="tabs" id="tabs"></nav>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>
<button class="bell" id="bell" aria-label="Avisos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="badge" id="belln" style="display:none"></span></button>
<div class="alerts" id="alerts"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const C={verde:"#35c47c",amarillo:"#f2b33d",naranja:"#ff6a00",rojo:"#ff4d4d",gris:"#6f655d"};
const STAGE_COLOR={nuevo:"#6f655d",contactado:"#5aa9ff",respondio:"#a78bfa",demo:"#f2b33d",llamada:"#ff8a3d",propuesta:"#ff6a00",ganado:"#35c47c",perdido:"#ff4d4d"};
const STAGES=[["nuevo","Por contactar"],["contactado","Contactado"],["respondio","Respondió"],["demo","Demo"],["llamada","Llamada"],["propuesta","Propuesta"],["ganado","Ganado"],["perdido","Perdido"]];
const SL=Object.fromEntries(STAGES);
const ICON={
  inicio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  pipeline:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>',
  envios:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>',
  bandeja:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  sim:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6M10 3v6L4 19a1 1 0 0 0 .9 1.5h14.2A1 1 0 0 0 20 19l-6-10V3"/></svg>'
};
const VIEWS=[["inicio","Inicio"],["pipeline","Pipeline"],["envios","Envíos"],["bandeja","Bandeja"],["sim","Simulador"]];
let S=null, LEADS=null, charts={}, view=location.hash.startsWith("#lead=")?"inicio":(location.hash.slice(1)||"inicio");

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),3200)}
async function get(u){const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()}
async function post(u,body){const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json","X-App":"1"},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||r.status);return d}
async function postForm(u,fd){const r=await fetch(u,{method:"POST",headers:{"X-App":"1"},body:fd});const d=await r.json().catch(()=>({}));return d}
const money=v=>v?("$"+Math.round(v).toLocaleString("es-CO")):"$0";
const ago=iso=>{if(!iso)return"";const m=Math.round((Date.now()-Date.parse(iso))/6e4);if(m<1)return"ahora";if(m<60)return m+" min";const h=Math.round(m/60);if(h<24)return h+" h";const d=Math.round(h/24);return d+" d"};
const when=iso=>iso?new Date(iso).toLocaleString("es-CO",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}):"";
const dur=m=>m==null?"—":m<60?m+" min":m<1440?Math.floor(m/60)+" h "+(m%60?m%60+" min":""):Math.floor(m/1440)+" d";
const dot=c=>`<i class="dot" style="background:${C[c]||C.gris}"></i>`;

function nav(){
  const badge=k=>k==="bandeja"&&S&&S.drafts?`<span class="badge">${S.drafts}</span>`:"";
  const link=([k,l])=>k==="sim"?`<a href="/panel/simular">${ICON[k]}<span>${l}</span></a>`:`<a href="#${k}" class="${view===k?"on":""}">${ICON[k]}<span>${l}</span>${badge(k)}</a>`;
  $("#nav").innerHTML=VIEWS.map(link).join("");
  $("#tabs").innerHTML=VIEWS.map(link).join("");
  if(S){const s=S.sending;$("#sidefoot").innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">${dot(s.auto?"verde":"gris")}<b>Envío ${s.auto?"encendido":"apagado"}</b></div>Hoy ${s.sentToday} de ${s.quota} enviados${s.ready?"":"<br><span style='color:var(--amarillo)'>Falta conectar Evolution</span>"}`}

window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h.startsWith("lead=")){openLead(decodeURIComponent(h.slice(5)));return}view=h||"inicio";render()});

// Avisos: campana + notificación del navegador mientras el panel está abierto
let AL={items:[],unseen:0},seenIds=null;
async function loadAlerts(){
  try{AL=await get("/panel/api/alerts")}catch(e){return}
  const n=$("#belln");n.style.display=AL.unseen?"":"none";n.textContent=AL.unseen>9?"9+":AL.unseen;
  const ids=AL.items.map(a=>a.id);
  if(seenIds){const fresh=AL.items.filter(a=>!seenIds.has(a.id));if(fresh.length){$("#bell").classList.remove("ring");void $("#bell").offsetWidth;$("#bell").classList.add("ring");toast(fresh[0].text);
    if("Notification"in window&&Notification.permission==="granted")fresh.slice(0,3).forEach(a=>{const no=new Notification("Prospector",{body:a.text,tag:a.id});no.onclick=()=>{window.focus();openLead(a.lead)}})}}
  seenIds=new Set(ids);if($("#alerts").classList.contains("on"))drawAlerts();
}
function drawAlerts(){
  const perm=pushState()!=="on";
  $("#alerts").innerHTML=`<h4>Avisos ${perm?`<button class="btn sm" id="perm">🔔 Activar avisos</button>`:""}</h4>`+
    (AL.items.length?AL.items.map(a=>`<div class="it ${a.seen?"":"new"}" data-l="${esc(a.lead)}"><div>${esc(a.text)}<small>${ago(a.created_at)}</small></div></div>`).join(""):`<div class="empty">Aquí verás cuando un prospecto responda, abra su demo, hable con el agente o agende.</div>`)+
    (perm?`<div class="empty">📲 Activa los avisos para que te lleguen al celular aunque la app esté cerrada${IOS&&!STANDALONE?" (en iPhone, primero instálala: Compartir → Agregar a inicio)":""}.</div>`:"");
  $("#alerts").querySelectorAll(".it").forEach(e=>e.onclick=()=>{$("#alerts").classList.remove("on");openLead(e.dataset.l)});
  const p=$("#perm");if(p)p.onclick=enablePush;
}
// App instalable + notificaciones push
const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent),STANDALONE=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js",{scope:"/"}).catch(()=>{});
function pushState(){if(!("Notification"in window)||!("PushManager"in window))return IOS&&!STANDALONE?"ios":"no";return Notification.permission==="granted"&&localStorage.getItem("push")==="1"?"on":Notification.permission==="denied"?"denied":"off"}
const u8=s=>Uint8Array.from(atob((s+"===".slice((s.length+3)%4)).replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
async function enablePush(){
  const st=pushState();
  if(st==="ios"){toast("En iPhone: toca Compartir → Agregar a inicio, abre la app desde ahí y activa los avisos");return}
  if(st==="no"){toast("Este navegador no admite notificaciones");return}
  if(st==="denied"){toast("Tienes las notificaciones bloqueadas para esta web: actívalas en los ajustes del navegador");return}
  try{
    if(await Notification.requestPermission()!=="granted"){toast("Sin permiso no puedo avisarte");return}
    const {key}=await get("/panel/api/push/key");if(!key){toast("Falta configurar la clave de avisos en el servidor");return}
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(key)});
    await post("/panel/api/push/sub",sub.toJSON());try{localStorage.setItem("push","1")}catch(e){}
    const r=await post("/panel/api/push/test",{});toast(r.sent?"Listo ✅ Te llegó un aviso de prueba":"Suscrito, pero la prueba no salió");loadAlerts();drawAlerts();render()
  }catch(e){toast("No se pudo activar: "+e.message)}
}
let deferredInstall=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;if(view==="envios")render()});
async function installApp(){if(deferredInstall){deferredInstall.prompt();deferredInstall=null}else toast(IOS?"Toca Compartir → Agregar a inicio":"Abre el menú del navegador → Instalar app")}
$("#bell").onclick=async()=>{const o=$("#alerts").classList.toggle("on");if(o){drawAlerts();if(AL.unseen){await post("/panel/api/alerts/seen",{}).catch(()=>{});AL.unseen=0;$("#belln").style.display="none"}}};
document.addEventListener("click",e=>{if(!e.target.closest("#alerts,#bell"))$("#alerts").classList.remove("on")});
loadAlerts();setInterval(()=>{if(document.visibilityState==="visible")loadAlerts()},20000);

async function load(){S=await get("/panel/api/state");nav()}
async function loadLeads(){LEADS=await get("/panel/api/leads")}
async function render(){
  nav();
  Object.values(charts).forEach(c=>c.destroy());charts={};
  const m=$("#main");
  try{
    if(view==="inicio"){await load();m.innerHTML=homeHTML();homeCharts()}
    else if(view==="pipeline"){await Promise.all([load(),loadLeads()]);m.innerHTML=pipelineHTML();bindBoard()}
    else if(view==="envios"){await load();const t=await get("/panel/api/today");m.innerHTML=sendHTML(t);bindSend()}
    else if(view==="bandeja"){await load();const d=await get("/panel/api/drafts");m.innerHTML=inboxHTML(d)}
  }catch(e){m.innerHTML=`<div class="card">No pude cargar: ${esc(e.message)}</div>`}
}

/* ---------- INICIO ---------- */

      <div class="ring"><svg width="96" height="96"><circle cx="48" cy="48" r="${R}" stroke="#221a14" stroke-width="9" fill="none"/><circle cx="48" cy="48" r="${R}" stroke="url(#g)" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-pct)}"/><defs><linearGradient id="g"><stop offset="0" stop-color="#ffb27a"/><stop offset="1" stop-color="#ff6a00"/></linearGradient></defs></svg>

      <div><div style="font-size:17px;font-weight:700;margin-bottom:8px">Tu día</div>
        <div class="chips">
          <span class="chip">${dot(s.auto?"verde":"gris")} Envío automático ${s.auto?"encendido":"apagado"}</span>
          ${S.drafts?`<a class="chip hot" href="#bandeja">💬 ${S.drafts} respuesta${S.drafts>1?"s":""} por aprobar</a>`:`<span class="chip">💬 Sin respuestas pendientes</span>`}
          ${k.overdue?`<a class="chip warn" href="#pipeline">⏰ ${k.overdue} seguimiento${k.overdue>1?"s":""} vencido${k.overdue>1?"s":""}</a>`:""}
          <span class="chip">📥 ${k.queued||0} en cola</span>
          ${s.nextAt&&s.auto?`<span class="chip">⏭ Próximo envío ${when(s.nextAt)}</span>`:""}
          ${!s.ready?`<span class="chip warn">🔌 Falta conectar Evolution</span>`:""}
        </div></div>
    </div>
    <div class="grid kpis">
      ${kpi("Prospectos",(k.total||0).toLocaleString("es-CO"),`${k.queued||0} esperando turno`,"#6f655d")}
      ${kpi("Contactados",k.contacted||0,"primer mensaje enviado","#5aa9ff")}
      ${kpi("Respondieron",k.replied||0,`${rate}% de respuesta · ${k.avg_response!=null?"media "+dur(Math.round(k.avg_response)):"sin datos"}`,"#a78bfa")}
      ${kpi("Calientes",k.hot||0,"demo, llamada o propuesta","#ff6a00")}
      ${kpi("Ganados",k.won||0,money(k.won_value)+" cerrados","#35c47c")}
      ${kpi("En juego",money(k.pipeline_value),"valor del pipeline abierto","#f2b33d")}
    </div>
    <div class="grid row2">
      <div class="card"><h3>Embudo<span class="r"><a href="#pipeline">Ver pipeline →</a></span></h3><div class="funnel">
        ${S.stages.map(x=>`<div class="fr" onclick="location.hash='pipeline'"><span>${x.label}</span><div class="bar"><i style="width:${Math.max(x.n?4:0,100*x.n/max)}%;background:linear-gradient(90deg,${STAGE_COLOR[x.key]}cc,${STAGE_COLOR[x.key]}55)"></i><span>${x.n}</span></div><span class="v">${x.value?money(x.value):""}</span></div>`).join("")}
      </div></div>
      <div class="card"><h3>Últimos 14 días<span class="r" style="color:var(--mut)">enviados vs respuestas</span></h3><div class="chart"><canvas id="c-days"></canvas></div></div>
    </div>
    <div class="grid row3">
      <div class="card"><h3>Semáforo de respuesta</h3><div class="chart" style="height:190px"><canvas id="c-colors"></canvas></div></div>

      <div class="card"><h3>Actividad reciente</h3><div class="list">${

function abHTML(){
  const v={A:{sent:0,replied:0},B:{sent:0,replied:0}};(S.variants||[]).forEach(x=>v[x.variant]={sent:x.sent,replied:x.replied});
  const row=(k,label)=>{const r=v[k].sent?Math.round(100*v[k].replied/v[k].sent):0;return `<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span><b>${k}</b> · ${label}</span><span style="color:var(--mut)">${v[k].replied}/${v[k].sent} · <b style="color:var(--fg)">${r}%</b></span></div><div class="fr" style="grid-template-columns:1fr"><div class="bar" style="height:12px"><i style="width:${r}%;background:${k==="A"?"var(--a)":"var(--azul)"}"></i></div></div></div>`};
  const tot=v.A.sent+v.B.sent;
  return row("A","pregunta espejo")+row("B","demo directa")+`<small style="color:var(--dim)">${tot<30?"Con menos de 30 envíos aún no hay ganador claro.":"Gana la de mayor % de respuesta."}</small>`;
}
function nichesHTML(){
  if(!S.niches.length)return`<div class="empty">Caza tu primer nicho en Envíos.</div>`;
  const max=Math.max(...S.niches.map(n=>n.n));
  return S.niches.map(n=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.niche)}</span><span style="color:var(--mut)">${n.n}${n.replied?` · ${n.replied} resp.`:""}</span></div><div class="bar" style="height:8px;border-radius:6px;background:#1a140f;margin-top:4px;position:relative;overflow:hidden"><i style="position:absolute;inset:0 auto 0 0;width:${100*n.n/max}%;background:linear-gradient(90deg,#ff6a00,#ffb27a);border-radius:6px"></i></div></div>`).join("");
}
function homeCharts(){
  if(!window.Chart)return;
  Chart.defaults.color="#a59a90";Chart.defaults.font.family="Inter,system-ui,sans-serif";Chart.defaults.borderColor="#251d17";
  const days=[];for(let i=13;i>=0;i--){const d=new Date(Date.now()-5*36e5-i*864e5);days.push(d.toISOString().slice(0,10))}
  const by=Object.fromEntries((S.series||[]).map(r=>[r.d,r]));
  charts.days=new Chart($("#c-days"),{type:"bar",data:{labels:days.map(d=>new Date(d+"T12:00").toLocaleDateString("es-CO",{day:"numeric",month:"short"})),datasets:[
    {type:"bar",label:"Enviados",data:days.map(d=>by[d]?.sent||0),backgroundColor:"rgba(255,106,0,.75)",borderRadius:6,maxBarThickness:22},
    {type:"line",label:"Respuestas",data:days.map(d=>by[d]?.replies||0),borderColor:"#a78bfa",backgroundColor:"#a78bfa",tension:.35,pointRadius:3}]},
    options:{maintainAspectRatio:false,plugins:{legend:{labels:{usePointStyle:true,boxWidth:8}}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,ticks:{precision:0}}}}});
  const order=["verde","amarillo","naranja","rojo"],lab={verde:"0–15 min",amarillo:"15–60 min",naranja:"1–6 h",rojo:"+6 h"};
  const cm=Object.fromEntries((S.colors||[]).map(r=>[r.color,r.n]));const has=order.some(o=>cm[o]);
  charts.colors=new Chart($("#c-colors"),{type:"doughnut",data:{labels:order.map(o=>lab[o]),datasets:[{data:has?order.map(o=>cm[o]||0):[1],backgroundColor:has?order.map(o=>C[o]):["#221a14"],borderColor:"#0b0907",borderWidth:3}]},
    options:{maintainAspectRatio:false,cutout:"68%",plugins:{legend:{position:"right",labels:{usePointStyle:true,boxWidth:8}},tooltip:{enabled:has}}}});
}

/* ---------- PIPELINE ---------- */
let F={q:"",origin:"",niche:""};
function pipelineHTML(){
  const niches=[...new Set(LEADS.map(l=>l.niche).filter(Boolean))].sort();
  return `<div class="top"><div><h1>Pipeline</h1><p>Arrastra cada tarjeta a su etapa o ábrela para moverla.</p></div><div class="actions"><button class="btn" onclick="newLead()">＋ Prospecto</button></div></div>
  <div class="toolbar">
    <input class="in" id="fq" placeholder="🔎 Buscar nombre o ciudad" value="${esc(F.q)}" style="flex:1 1 220px">
    <select class="in" id="fo"><option value="">Todos los orígenes</option><option value="cazador" ${F.origin==="cazador"?"selected":""}>Cazador</option><option value="anuncio" ${F.origin==="anuncio"?"selected":""}>Anuncio</option><option value="manual" ${F.origin==="manual"?"selected":""}>Manual</option></select>
    <select class="in" id="fn"><option value="">Todos los nichos</option>${niches.map(n=>`<option ${F.niche===n?"selected":""}>${esc(n)}</option>`).join("")}</select>
  </div><div class="stagebar" id="stagebar">${stageBar()}</div><div class="board" id="board">${boardCols()}</div>`;
}
function stageBar(){
  const q=F.q.toLowerCase();
  const list=LEADS.filter(l=>(!q||(l.name+" "+(l.city||"")).toLowerCase().includes(q))&&(!F.origin||l.origin===F.origin)&&(!F.niche||l.niche===F.niche));
  return STAGES.map(([k,label],i)=>`<button data-i="${i}" class="${i===0?"on":""}"><i class="dot" style="background:${STAGE_COLOR[k]}"></i>${label}<small>${list.filter(l=>l.stage===k).length}</small></button>`).join("");
}
function bindStageBar(){
  const bar=$("#stagebar"),board=$("#board");if(!bar)return;
  bar.querySelectorAll("button").forEach(b=>b.onclick=()=>{const col=board.children[+b.dataset.i];board.scrollTo({left:col.offsetLeft-board.offsetLeft,behavior:"smooth"})});
  board.onscroll=()=>{const i=Math.round(board.scrollLeft/(board.firstElementChild.offsetWidth+12));bar.querySelectorAll("button").forEach((b,j)=>{const on=j===i;if(on&&!b.classList.contains("on"))b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});b.classList.toggle("on",on)})};
}
function boardCols(){
  const q=F.q.toLowerCase();
  const list=LEADS.filter(l=>(!q||(l.name+" "+(l.city||"")).toLowerCase().includes(q))&&(!F.origin||l.origin===F.origin)&&(!F.niche||l.niche===F.niche));
  return STAGES.map(([k,label])=>{
    const items=list.filter(l=>l.stage===k);const sum=items.reduce((a,l)=>a+(l.value||0),0);const shown=items.slice(0,60);
    return `<div class="col" data-stage="${k}"><div class="ch"><i class="dot" style="background:${STAGE_COLOR[k]}"></i><div><b>${label}</b>${sum?`<span class="sum">${money(sum)}</span>`:""}</div><span class="c">${items.length}</span></div>
      <div class="cards">${shown.map(card).join("")}${items.length>shown.length?`<div class="more">+${items.length-shown.length} más · usa el buscador</div>`:""}${!items.length?`<div class="more">Suelta aquí</div>`:""}</div></div>`}).join("");
}
function card(l){
  const late=l.next_at&&Date.parse(l.next_at)<Date.now();
  return `<div class="lc" draggable="true" data-id="${esc(l.phone)}"><b>${esc(l.name)}</b><div class="m">
    ${l.color?dot(l.color):""}<span class="tag ${esc(l.origin)}">${esc(l.origin)}</span>${l.city?`<span>${esc(l.city)}</span>`:""}${l.rating?`<span>⭐ ${l.rating}</span>`:""}
    ${l.value?`<span style="color:var(--verde);font-weight:600">${money(l.value)}</span>`:""}
    ${l.next_at?`<span class="${late?"due":""}">${late?"⏰":"📅"} ${when(l.next_at)}</span>`:""}
    ${l.demo_views?`<span style="color:var(--a);font-weight:600">🔥 vio la demo${l.demo_messages?` · ${l.demo_messages} msj`:""}</span>`:l.demo_views===0?`<span>🎬 demo lista</span>`:""}</div></div>`;
}
function bindBoard(){
  const re=()=>{$("#board").innerHTML=boardCols();$("#stagebar").innerHTML=stageBar();bindStageBar();bindCards()};
  bindStageBar();
  $("#fq").oninput=e=>{F.q=e.target.value;re()};$("#fo").onchange=e=>{F.origin=e.target.value;re()};$("#fn").onchange=e=>{F.niche=e.target.value;re()};
  document.querySelectorAll(".col").forEach(col=>{
    col.ondragover=e=>{e.preventDefault();col.classList.add("drop")};
    col.ondragleave=()=>col.classList.remove("drop");
    col.ondrop=async e=>{e.preventDefault();col.classList.remove("drop");const id=e.dataTransfer.getData("text/plain");const l=LEADS.find(x=>x.phone===id);if(!l||l.stage===col.dataset.stage)return;
      const prev=l.stage;l.stage=col.dataset.stage;re();
      try{await post("/panel/api/lead/"+encodeURIComponent(id),{stage:l.stage});toast(`${l.name} → ${SL[l.stage]}`)}catch(err){l.stage=prev;re();toast("No se pudo mover: "+err.message)}};
  });
  bindCards();
}
function bindCards(){document.querySelectorAll(".lc").forEach(c=>{c.ondragstart=e=>{e.dataTransfer.setData("text/plain",c.dataset.id);c.classList.add("dragging")};c.ondragend=()=>c.classList.remove("dragging");c.onclick=()=>openLead(c.dataset.id)})}

/* ---------- FICHA ---------- */
let CUR=null,chatTimer=null;
async function openLead(id){
  $("#scrim").classList.add("on");$("#drawer").classList.add("on");$("#drawer").innerHTML=`<div class="skel">Abriendo ficha…</div>`;
  try{CUR=await get("/panel/api/lead/"+encodeURIComponent(id));drawLead()}catch(e){$("#drawer").innerHTML=`<div class="skel">No pude abrirla (${esc(e.message)})</div>`}
}
function closeLead(){$("#scrim").classList.remove("on");$("#drawer").classList.remove("on");clearInterval(chatTimer);if(CUR&&CUR._dirty)render();CUR=null}
$("#scrim").onclick=closeLead;document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLead()});
function drawLead(){
  const l=CUR.lead,id=l.phone,real=!id.startsWith("c-");
  const idx=STAGES.findIndex(s=>s[0]===l.stage);
  const nextVal=l.next_at?new Date(Date.parse(l.next_at)-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):"";
  $("#drawer").innerHTML=`
  <div class="dh"><div style="min-width:0"><div class="chips" style="margin-bottom:6px"><span class="tag ${esc(l.origin)}">${esc(l.origin)}</span>${l.color?`<span class="chip">${dot(l.color)} respondió en ${dur(l.response_minutes)}</span>`:""}${l.variant?`<span class="chip">variante ${esc(l.variant)}</span>`:""}</div>
    <h2>${esc(l.name)}</h2><small style="color:var(--mut)">${esc([l.category,l.city].filter(Boolean).join(" · "))}</small></div>
    <button class="x" onclick="closeLead()" aria-label="Cerrar">✕</button></div>
  <div class="db">
    <div class="steps">${STAGES.map(([k,lab],i)=>`<button class="step ${i<idx&&l.stage!=="perdido"?"done":""} ${k===l.stage?"on":""} ${k==="perdido"?"lost":""} ${k==="ganado"?"win":""}" onclick="saveLead({stage:'${k}'})">${lab}</button>`).join("")}</div>
    <div class="info">

function inboxHTML(d){
  return `<div class="top"><div><h1>Bandeja</h1><p>Respuestas que redactó el worker cuando un negocio te contestó. Revisa, edita y envía.</p></div></div>
  <div class="grid">${d.map(x=>`<div class="card"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">${dot(x.color)}<b style="cursor:pointer" onclick="${x.lead?`openLead('${esc(x.lead)}')`:""}">${esc(x.name||"Chat")}</b><span style="color:var(--mut);font-size:12px">${esc(x.city||"")} · respondió en ${dur(x.response_minutes)} · ${esc(x.branch||"")}</span><span style="margin-left:auto;color:var(--dim);font-size:12px">${ago(x.created_at)}</span></div>
    <textarea class="in" rows="5" id="d-${esc(x.id)}">${esc(x.text)}</textarea>
    <div class="actions" style="margin-top:10px"><button class="btn sm" onclick="inboxAct('${esc(x.id)}','send')">Enviar</button><button class="btn ghost sm" onclick="inboxAct('${esc(x.id)}','discard')">Descartar</button>${x.lead?`<button class="btn ghost sm" onclick="openLead('${esc(x.lead)}')">Ver ficha y chat</button>`:""}</div></div>`).join("")||`<div class="card"><div class="empty">Todo al día ✨ Cuando un negocio conteste, aquí aparecerá la respuesta sugerida.</div></div>`}</div>`;
}
async function inboxAct(id,a){const fd=new FormData();fd.set("text",$("#d-"+id).value);await fetch(`/panel/drafts/${id}/${a}`,{method:"POST",body:fd});toast(a==="send"?"Enviado por el CRM":"Descartado");render()}

render();
if(location.hash.startsWith("#lead="))openLead(decodeURIComponent(location.hash.slice(6)));
setInterval(()=>{if(!CUR&&document.visibilityState==="visible"&&view!=="envios")render()},60000);
</script>
</body>
</html>
