name = "hunter-prospector"
main = "src/index.ts"
compatibility_date = "2025-04-01"

[[d1_databases]]
binding = "DB"
database_name = "hunter-prospector"
database_id = "0907f943-58e9-41f1-b14a-1514d73ed953"

[triggers]
crons = ["*/10 * * * *"]   # Canal 1: un envío como mucho por vuelta

[ai]
binding = "AI"

[vars]
# URL base del CRM Hunter AI, sin barra final (ej. https://app.tudominio.com)
CRM_BASE_URL = "https://app.hunterai.site"
# UUID del cliente de prospección. Si se deja vacío, el worker lo aprende del primer webhook firmado
CRM_CLIENT_ID = ""
# Modelo de OpenRouter para redactar los mensajes
OPENROUTER_MODEL = "anthropic/claude-sonnet-4.5"
# Modelo de Workers AI para clasificar
CLASSIFY_MODEL = "@cf/meta/llama-3.1-8b-instruct"
# Opcional: JSON con los ids de etapa del CRM, ej. {"respondio":"uuid","perdido":"uuid"}
CRM_STAGES = "{}"

# Secretos (wrangler secret put NOMBRE), nunca aquí:
#   EVOLUTION_URL        URL del servidor de Evolution (Canal 1)
#   EVOLUTION_INSTANCE   instancia del número QR (hunterai-<id del canal>)
#   EVOLUTION_API_KEY    token propio de ESA instancia (no la clave global de Evolution)
#   CRM_API_TOKEN        token ol_… de una integración del CRM
#   CRM_WEBHOOK_SECRET   whsec_… que da el CRM al crear la suscripción
#   OPENROUTER_API_KEY
#   PANEL_PASSWORD       contraseña del panel /panel
